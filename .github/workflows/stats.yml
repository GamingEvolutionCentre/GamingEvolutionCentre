name: Update GitHub Stats

on:
  workflow_dispatch:

  # Update the stats/language boxes every 5 minutes
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout profile repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ---------------------------------------------------------
      # 1. GitHub Stats
      # ---------------------------------------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=GamingEvolutionCentre&show_icons=true&theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      # ---------------------------------------------------------
      # 2 + 3. Generate language cards from ALL repositories
      # Public + Private
      # ---------------------------------------------------------
      - name: Generate Language Cards
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          mkdir -p profile

          python3 <<'PY'
          import json
          import os
          import urllib.request
          import html

          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          def github_get(url):
              request = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode())


          # -----------------------------------------------------
          # Get ALL repositories accessible by the PAT
          # Includes public + private repositories
          # -----------------------------------------------------
          repos = []
          page = 1

          while True:
              data = github_get(
                  "https://api.github.com/user/repos"
                  f"?visibility=all"
                  f"&affiliation=owner"
                  f"&per_page=100"
                  f"&page={page}"
              )

              if not data:
                  break

              repos.extend(data)
              page += 1


          # -----------------------------------------------------
          # Collect language byte counts
          # -----------------------------------------------------
          language_bytes = {}

          for repo in repos:

              # Ignore forks
              if repo.get("fork"):
                  continue

              languages = github_get(repo["languages_url"])

              for language, size in languages.items():
                  language_bytes[language] = (
                      language_bytes.get(language, 0) + size
                  )


          languages = sorted(
              language_bytes.items(),
              key=lambda item: item[1],
              reverse=True
          )

          total_bytes = sum(
              size for _, size in languages
          )


          # =====================================================
          # CARD 1:
          # Languages Used Across My Repositories
          # =====================================================

          width = 500
          padding = 25

          language_names = [
              language for language, _ in languages
          ]

          rows = []
          current_row = []
          current_length = 0

          for language in language_names:

              estimated_length = len(language) + 3

              if current_length + estimated_length > 45:
                  rows.append(current_row)
                  current_row = []
                  current_length = 0

              current_row.append(language)
              current_length += estimated_length

          if current_row:
              rows.append(current_row)

          if not rows:
              rows = [["No language data found"]]

          height = 105 + (len(rows) * 30)

          svg = f'''
          <svg xmlns="http://www.w3.org/2000/svg"
               width="{width}"
               height="{height}"
               viewBox="0 0 {width} {height}">

            <style>
              .card {{
                fill: #00000000;
                stroke: #e4e2e2;
                stroke-width: 1;
              }}

              .title {{
                fill: #00aeef;
                font-family: -apple-system, BlinkMacSystemFont,
                             "Segoe UI", Helvetica, Arial, sans-serif;
                font-size: 20px;
                font-weight: 600;
              }}

              .text {{
                fill: #8b949e;
                font-family: -apple-system, BlinkMacSystemFont,
                             "Segoe UI", Helvetica, Arial, sans-serif;
                font-size: 15px;
                font-weight: 500;
              }}
            </style>

            <rect
              class="card"
              x="0.5"
              y="0.5"
              width="{width - 1}"
              height="{height - 1}"
              rx="6"
            />

            <text
              class="title"
              x="{padding}"
              y="40"
            >
              Languages Used Across My Repositories
            </text>
          '''

          y = 80

          for row in rows:

              row_text = "  •  ".join(row)

              svg += f'''
              <text
                class="text"
                x="{padding}"
                y="{y}"
              >
                {html.escape(row_text)}
              </text>
              '''

              y += 30

          svg += "</svg>"

          with open(
              "profile/languages.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)


          # =====================================================
          # CARD 2:
          # Most Used Languages
          # =====================================================

          top_languages = languages[:10]

          row_height = 32
          height = 90 + (len(top_languages) * row_height)

          if not top_languages:
              height = 140

          svg = f'''
          <svg xmlns="http://www.w3.org/2000/svg"
               width="{width}"
               height="{height}"
               viewBox="0 0 {width} {height}">

            <style>
              .card {{
                fill: #00000000;
                stroke: #e4e2e2;
                stroke-width: 1;
              }}

              .title {{
                fill: #00aeef;
                font-family: -apple-system, BlinkMacSystemFont,
                             "Segoe UI", Helvetica, Arial, sans-serif;
                font-size: 20px;
                font-weight: 600;
              }}

              .language {{
                fill: #8b949e;
                font-family: -apple-system, BlinkMacSystemFont,
                             "Segoe UI", Helvetica, Arial, sans-serif;
                font-size: 15px;
                font-weight: 500;
              }}

              .percentage {{
                fill: #8b949e;
                font-family: -apple-system, BlinkMacSystemFont,
                             "Segoe UI", Helvetica, Arial, sans-serif;
                font-size: 14px;
              }}

              .bar-bg {{
                fill: #30363d;
              }}

              .bar {{
                fill: #00aeef;
              }}
            </style>

            <rect
              class="card"
              x="0.5"
              y="0.5"
              width="{width - 1}"
              height="{height - 1}"
              rx="6"
            />

            <text
              class="title"
              x="{padding}"
              y="40"
            >
              Most Used Languages
            </text>
          '''

          y = 75

          if top_languages:

              for language, size in top_languages:

                  percentage = (
                      (size / total_bytes) * 100
                      if total_bytes
                      else 0
                  )

                  bar_width = 150
                  filled_width = (
                      bar_width * percentage / 100
                  )

                  svg += f'''
                  <text
                    class="language"
                    x="{padding}"
                    y="{y}"
                  >
                    {html.escape(language)}
                  </text>

                  <text
                    class="percentage"
                    x="450"
                    y="{y}"
                    text-anchor="end"
                  >
                    {percentage:.1f}%
                  </text>

                  <rect
                    class="bar-bg"
                    x="150"
                    y="{y - 11}"
                    width="{bar_width}"
                    height="8"
                    rx="4"
                  />

                  <rect
                    class="bar"
                    x="150"
                    y="{y - 11}"
                    width="{filled_width:.1f}"
                    height="8"
                    rx="4"
                  />
                  '''

                  y += row_height

          else:

              svg += '''
              <text
                class="language"
                x="25"
                y="80"
              >
                No language data found
              </text>
              '''

          svg += "</svg>"

          with open(
              "profile/top-langs.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)


          # -----------------------------------------------------
          # Log useful information without exposing repo names
          # -----------------------------------------------------
          print(
              f"Repositories included: "
              f"{len([r for r in repos if not r.get('fork')])}"
          )

          print("Languages found:")

          for language, size in languages:
              print(f" - {language}")

          PY

      # ---------------------------------------------------------
      # Commit generated cards
      # ---------------------------------------------------------
      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg
          git add profile/languages.svg
          git add profile/top-langs.svg

          git diff --cached --quiet && exit 0

          git commit -m "Update GitHub stats"
          git push
