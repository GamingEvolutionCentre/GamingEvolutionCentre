          Shell
        </text>

        

        <rect
          class="bar-bg"
          x="200"
          y="64"
          width="200"
          height="8"
          rx="4"
        />

        

        <rect
          class="bar"
          x="200"
          y="64"
          width="200.0"
          height="8"
          rx="4"
        />

        

        <text
          class="percentage"
          x="465"
          y="75"
          text-anchor="end"
        >
          100.0%
        </text>

        </svg>