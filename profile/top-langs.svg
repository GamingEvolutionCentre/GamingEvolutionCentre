
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="500"
    height="122"
    viewBox="0 0 500 122"
>

  <style>

    .card {
      fill: #00000000;
      stroke: #e4e2e2;
      stroke-width: 1;
    }


    .title {
      fill: #00aeef;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      font-size: 20px;
      font-weight: 600;
    }


    .language {
      fill: #8b949e;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      font-size: 15px;
      font-weight: 500;
    }


    .percentage {
      fill: #8b949e;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      font-size: 14px;
      font-weight: 400;
    }


    .bar-bg {
      fill: #30363d;
    }


    .bar {
      fill: #00aeef;
    }

  </style>


  <rect
    class="card"
    x="0.5"
    y="0.5"
    width="499"
    height="121"
    rx="6"
  />


  <text
    class="title"
